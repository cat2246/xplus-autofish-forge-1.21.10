// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = '1.3.7-forge-mc1.21.10'
group = 'com.wudji'
base { archivesName = 'xplus-autofish' }

// Mojang ships Java 21 to end users in 1.20.5+, so your mod should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Temporary bootstrap exclusions; remove as Forge gameplay entry points are ported.
sourceSets.main.java {
    exclude '**/NeoForgedModXPlusAutofish.java'
    exclude '**/XPlusAutofish.java'
    exclude '**/gui/**'
    exclude '**/mixin/**'
    exclude '**/mointor/**'
    exclude '**/scheduler/**'
}

minecraft {
    mappings channel: 'official', version: '1.21.10'

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'autofish'
        }

        register('client')
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21.10-60.1.9')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
