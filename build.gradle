// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
    id 'net.minecraftforge.renamer' version '1.1.2'
}

version = '1.3.7-forge-mc1.21.10'
group = 'com.wudji'
base { archivesName = 'xplus-autofish' }

// Mojang ships Java 21 to end users in 1.20.5+, so your mod should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.10'

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'autofish'
        }

        register('client')
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21.10-60.1.9')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('jar') {
    from('LICENSE')
    destinationDirectory = layout.buildDirectory.dir('intermediates')
}

renamer.mappings.from minecraft.dependency.toObfFile
renamer.enableMixinRefmaps {
    config 'autofish.mixins.json'
    source sourceSets.main, 'xplusautofish'
    jar tasks.named('jar')
}
def reobfJar = renamer.classes('reobfJar', tasks.named('jar')) {
    map.from minecraft.dependency.toObfFile
    archiveClassifier = ''
}
reobfJar.configure {
    output.set(layout.buildDirectory.file('libs/xplus-autofish-1.3.7-forge-mc1.21.10.jar'))
}
tasks.named('build') {
    dependsOn(reobfJar)
}

def packagedJar = reobfJar.flatMap { it.output }

tasks.register('verifyJarMetadata') {
    dependsOn reobfJar

    doLast {
        def jarFile = packagedJar.get().asFile
        def requiredEntries = [
                'META-INF/mods.toml',
                'autofish.mixins.json',
                'xplusautofish.refmap.json',
                'com/wudji/xplusautofish/mixin/MixinClientPlayNetworkHandler.class',
                'com/wudji/xplusautofish/mixin/MixinFishHookEntity.class',
                'LICENSE',
                'assets/autofish/icon.png'
        ] as Set

        def forbiddenEntry = null
        def forbiddenText = null
        def missingEntries = new LinkedHashSet(requiredEntries)
        new java.util.jar.JarFile(jarFile).withCloseable { archive ->
            archive.entries().each { entry ->
                missingEntries.remove(entry.name)
                if (entry.name == 'META-INF/neoforge.mods.toml') {
                    forbiddenEntry = entry.name
                }
                if (!entry.isDirectory()) {
                    def contents = archive.getInputStream(entry).bytes
                    def textContents = new String(contents, java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (textContents =~ /(?i)cloth_config|neoforge\.mods\.toml/) {
                        forbiddenText = entry.name
                    }
                }
            }
        }

        if (!missingEntries.isEmpty() || forbiddenEntry != null || forbiddenText != null) {
            throw new GradleException("JAR metadata verification failed for ${jarFile.name}: missing=${missingEntries}, forbiddenEntry=${forbiddenEntry}, forbiddenText=${forbiddenText}")
        }
        logger.lifecycle("Verified Forge metadata and packaged assets in ${jarFile.name}")
    }
}
